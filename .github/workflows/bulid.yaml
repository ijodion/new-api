name: Build and Deploy New-API

on:
  workflow_dispatch: # 手动触发
  workflow_run:      # 监听 Upstream Sync
    workflows: ["Upstream Sync"]
    types:
      - completed

jobs:
  # ======================================================================================
  # 任务 1: 编译 Linux armhf (Musl/Static) -> Gzip 压缩传输
  # ======================================================================================
  deploy-armhf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip Upstream Merge (armhf)
        run: |
          echo "ℹ️ deploy-armhf builds the checked-out commit directly."
          echo "ℹ️ Skipping auto-merge with upstream/main to avoid transient upstream breakages on 32-bit builds."

      - name: Set Version
        run: |
          if [ -s VERSION ]; then
            echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_ENV
          else
            echo "VERSION=$(git describe --tags --always 2>/dev/null || echo 'dev')" >> $GITHUB_ENV
          fi
          echo "📦 VERSION=$VERSION"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: master

      - name: Patch 32-bit Int Overflow & Build Binary (Armv7 Musl Static)
        run: |
          # 修复 32 位架构 (GOARCH=arm) 下 MaxWalletQuota 超出 int32 最大值导致编译失败的问题
          if [ -f common/quota_math.go ]; then
            sed -i -E 's/(MaxWalletQuota[[:space:]]*=[[:space:]]*).*/\12147483647/' common/quota_math.go
            echo "✅ Patched MaxWalletQuota in common/quota_math.go for 32-bit build"
          fi

          CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7 CC="zig cc -target arm-linux-musleabihf" \
          go build -tags musl -ldflags "-s -w -linkmode external -extldflags '-static' -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-main .

      - name: Compress Binary
        run: |
          gzip -9 -f new-api-main
          ls -lh new-api-main.gz

      - name: Deploy & Restart (ARMHF with Retry)
        env:
          HOST: ${{ secrets.HOST_ARMHF }}
          PORT: ${{ secrets.PORT_ARMHF }}
          PASS: ${{ secrets.PASS_ARMHF }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

          HOST_CLEAN=$(echo "$HOST" | tr -d '[:space:]')
          PORT_CLEAN=$(echo "$PORT" | tr -d '[:space:]')
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o ServerAliveInterval=15 -o ConnectTimeout=30"

          UPLOAD_OK=0
          for i in 1 2 3; do
            echo "📂 [Attempt $i/3] Uploading new-api-main.gz to ARMHF server..."
            if sshpass -p "$PASS" scp $SSH_OPTS -P "$PORT_CLEAN" new-api-main.gz "root@${HOST_CLEAN}:/tmp/"; then
              UPLOAD_OK=1
              break
            fi
            echo "⚠️ Upload failed, retrying in 5 seconds..."
            sleep 5
          done

          if [ "$UPLOAD_OK" -ne 1 ]; then
            echo "❌ Failed to upload binary after 3 attempts."
            exit 1
          fi

          echo "🚀 Restarting service on ARMHF server..."
          sshpass -p "$PASS" ssh $SSH_OPTS -p "$PORT_CLEAN" "root@${HOST_CLEAN}" "
            set -e
            systemctl stop newapi.service || true
            cd /tmp
            rm -f new-api-main
            gunzip -f new-api-main.gz
            mv -f new-api-main /root/new-api/new-api-main
            chmod +x /root/new-api/new-api-main
            systemctl restart newapi.service
            echo '✅ ARMHF Deployment Done! Version: $VERSION'
          "

  # ======================================================================================
  # 任务 2: 编译 Linux arm64 (纯 IPv6 服务器)
  # ======================================================================================
  deploy-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add upstream https://github.com/QuantumNous/new-api.git || true
          git fetch upstream
          if git merge-base --is-ancestor upstream/main HEAD 2>/dev/null; then
            echo "✅ Already up-to-date with upstream/main"
          else
            echo "🔄 Merging upstream/main ..."
            git merge upstream/main --no-edit -m "chore: auto-merge upstream $(date -u +%Y-%m-%d)" || {
              echo "❌ Merge conflict! Please resolve manually in the fork."
              exit 1
            }
            echo "✅ Successfully merged upstream"
          fi

      - name: Enable IPv6 (via WARP)
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual

      - name: Set Version
        run: |
          if [ -s VERSION ]; then
            echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_ENV
          else
            echo "VERSION=$(git describe --tags --always 2>/dev/null || echo 'dev')" >> $GITHUB_ENV
          fi
          echo "📦 VERSION=$VERSION"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: master

      - name: Build Binary (Arm64)
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC="zig cc -target aarch64-linux-gnu" \
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-arm64 .
          gzip -9 -f new-api-arm64
          ls -lh new-api-arm64.gz

      - name: Resolve IPv6 & Deploy
        env:
          HOST: ${{ secrets.HOST_ARM64 }}
          PORT: ${{ secrets.PORT_ARM64 }}
          PASS: ${{ secrets.PASS_ARM64 }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass dnsutils

          # 1. 清理首尾空白字符、换行符以及可能包含的方括号
          HOST_CLEAN=$(echo "$HOST" | tr -d '[:space:][]')
          PORT_CLEAN=$(echo "$PORT" | tr -d '[:space:]')

          # 2. 判断是否直接提供了 IPv6 地址（包含冒号即为 IPv6，兼容 :: 缩写格式）
          if [[ "$HOST_CLEAN" == *:* ]]; then
            SERVER_IP="$HOST_CLEAN"
            echo "✅ Using provided IPv6 address: $SERVER_IP"
          else
            echo "🔍 Resolving AAAA for hostname: $HOST_CLEAN"
            # 依次通过 DoH/TCP DNS、公共 DNS 和系统解析器获取 AAAA，过滤 CNAME 行
            SERVER_IP=$(dig +tcp +short AAAA "$HOST_CLEAN" @1.1.1.1 2>/dev/null | grep ':' | grep -v '^::1$' | tail -n1 || true)
            if [ -z "$SERVER_IP" ]; then
              SERVER_IP=$(dig +tcp +short AAAA "$HOST_CLEAN" @8.8.8.8 2>/dev/null | grep ':' | grep -v '^::1$' | tail -n1 || true)
            fi
            if [ -z "$SERVER_IP" ]; then
              SERVER_IP=$(python3 -c "import socket; print(socket.getaddrinfo('$HOST_CLEAN', None, socket.AF_INET6)[0][4][0])" 2>/dev/null || true)
            fi
          fi

          # 3. 构造 SCP 与 SSH 目标参数（始终强制使用 -6 防止回退到错误的 IPv4 宿主机）
          if [ -n "${SERVER_IP:-}" ] && [ "$SERVER_IP" != "::1" ]; then
            echo "✅ Target IPv6: $SERVER_IP"
            SERVER_SCP_TARGET="root@[${SERVER_IP}]:/tmp/"
            SERVER_SSH_TARGET="root@${SERVER_IP}"
          else
            echo "⚠️ Could not pre-resolve AAAA, forcing SSH/SCP -6 directly on host."
            SERVER_SCP_TARGET="root@${HOST_CLEAN}:/tmp/"
            SERVER_SSH_TARGET="root@${HOST_CLEAN}"
          fi

          # 禁用公钥尝试，强制直接使用密码认证，避免触发 MaxAuthTries 或 Permission denied
          SSH_OPTS="-6 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o ServerAliveInterval=15 -o ConnectTimeout=30"

          # 4. SCP 上传（带 3 次重试）
          UPLOAD_OK=0
          for i in 1 2 3; do
            echo "📂 [Attempt $i/3] Starting SCP to $SERVER_SCP_TARGET ..."
            if sshpass -p "$PASS" scp $SSH_OPTS -P "$PORT_CLEAN" new-api-arm64.gz "$SERVER_SCP_TARGET"; then
              UPLOAD_OK=1
              break
            fi
            echo "⚠️ SCP failed, retrying in 5 seconds..."
            sleep 5
          done

          if [ "$UPLOAD_OK" -ne 1 ]; then
            echo "❌ Failed to SCP to ARM64 server after 3 attempts."
            exit 1
          fi

          # 5. SSH 重启服务
          echo "🚀 Starting SSH ..."
          sshpass -p "$PASS" ssh $SSH_OPTS -p "$PORT_CLEAN" "$SERVER_SSH_TARGET" "
            set -e
            systemctl stop newapi.service || true
            cd /tmp
            gunzip -f new-api-arm64.gz
            mv -f new-api-arm64 /root/newapi/new-api-arm64-v0.9.27-patch.1
            chmod +x /root/newapi/new-api-arm64-v0.9.27-patch.1
            systemctl restart newapi.service
            echo '✅ ARM64 IPv6 Deployment Done!'
          "

  # ======================================================================================
  # 任务 3: 编译 Linux amd64
  # ======================================================================================
  deploy-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add upstream https://github.com/QuantumNous/new-api.git || true
          git fetch upstream
          if git merge-base --is-ancestor upstream/main HEAD 2>/dev/null; then
            echo "✅ Already up-to-date with upstream/main"
          else
            echo "🔄 Merging upstream/main ..."
            git merge upstream/main --no-edit -m "chore: auto-merge upstream $(date -u +%Y-%m-%d)" || {
              echo "❌ Merge conflict! Please resolve manually in the fork."
              exit 1
            }
            echo "✅ Successfully merged upstream"
          fi

      - name: Set Version
        run: |
          if [ -s VERSION ]; then
            echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_ENV
          else
            echo "VERSION=$(git describe --tags --always 2>/dev/null || echo 'dev')" >> $GITHUB_ENV
          fi
          echo "📦 VERSION=$VERSION"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..

      - name: Build Binary (AMD64)
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-amd64 .
          gzip -9 -f new-api-amd64
          ls -lh new-api-amd64.gz

      - name: Deploy & Restart (AMD64 with Retry)
        env:
          HOST: ${{ secrets.HOST_AMD64 }}
          PORT: ${{ secrets.PORT_AMD64 }}
          PASS: ${{ secrets.PASS_AMD64 }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

          HOST_CLEAN=$(echo "$HOST" | tr -d '[:space:]')
          PORT_CLEAN=$(echo "$PORT" | tr -d '[:space:]')
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o ServerAliveInterval=15 -o ConnectTimeout=30"

          # 替换不稳定的 drone-scp，使用带重试的原生 OpenSSH
          UPLOAD_OK=0
          for i in 1 2 3; do
            echo "📂 [Attempt $i/3] Uploading new-api-amd64.gz to AMD64 server..."
            if sshpass -p "$PASS" scp $SSH_OPTS -P "$PORT_CLEAN" new-api-amd64.gz "root@${HOST_CLEAN}:/tmp/"; then
              UPLOAD_OK=1
              break
            fi
            echo "⚠️ Upload failed (connection reset/timeout), retrying in 5 seconds..."
            sleep 5
          done

          if [ "$UPLOAD_OK" -ne 1 ]; then
            echo "❌ Failed to upload binary to AMD64 server after 3 attempts."
            exit 1
          fi

          echo "🚀 Restarting service on AMD64 server..."
          sshpass -p "$PASS" ssh $SSH_OPTS -p "$PORT_CLEAN" "root@${HOST_CLEAN}" "
            set -e
            systemctl stop newapi.service || true
            cd /tmp
            gunzip -f new-api-amd64.gz
            mv -f new-api-amd64 /root/newapi/new-api-v0.9.27-patch.1
            chmod +x /root/newapi/new-api-v0.9.27-patch.1
            systemctl restart newapi.service
            echo '✅ AMD64 IPv4 Deployment Done!'
          "
